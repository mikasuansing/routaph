name: Keep-alive

# Prevents the free-tier Supabase project from auto-pausing after ~7 idle days
# (which takes the whole live app offline). Independent backup to the Vercel
# cron in vercel.json — this pings production every 2 days and can be run
# manually from the Actions tab.

on:
  schedule:
    - cron: '17 5 */2 * *' # every 2 days, 05:17 UTC (offset to avoid the top-of-hour crowd)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-alive endpoint
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/body.txt -w '%{http_code}' --max-time 30 \
            https://parapo-chi.vercel.app/api/cron/keepalive)
          echo "HTTP $code"
          cat /tmp/body.txt
          test "$code" = "200"
          grep -q '"pinged":true' /tmp/body.txt
